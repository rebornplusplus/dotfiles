# Alacritty configuration - v0.0.1
# Author: @rebornplusplus
#
# Ref: https://alacritty.org/config-alacritty.html
# > Do not put in things you do not understand!

import = [
	"~/.config/alacritty/themes/themes/night_owl.toml"
]
shell = { program = "/bin/bash", args = ["-c", "tmux"] }

[env]
# To support pasting in vim. :(
TERM = "xterm-256color"

[window]
dimensions = { columns = 120, lines = 30 }

[scrolling]
history = 100000

[font]
normal = { family = "Fira Code", style = "Regular" }
size = 10
offset = { x = 0, y = 0 }

[cursor]
style = { shape = "Block", blinking = "On" }

[terminal]
osc52 = "CopyPaste"
